# global-egress configuration
#
# Copy to /etc/global-egress/config.yaml and adjust. Every value shown here is
# the built-in default unless noted otherwise.

# How exit addresses are obtained.
#
#   relay-socks  Keep a few entry tunnels up and exit through the SOCKS proxy on
#                each provider relay. Hundreds of addresses, rotation costs one
#                TCP connection, and almost no key associations. Recommended.
#   wireguard    Give every slot its own tunnel. Self-contained, but each slot
#                costs a key association, and providers rate-limit those.
mode: relay-socks

relays:
  # Provider relay list, used in relay-socks mode.
  url: https://api.mullvad.net/www/relays/wireguard/
  # Cached copy so a restart works without network. Relative to state_dir.
  cache: relays.json
  refresh: 24h

entries:
  # The tunnels every relay-socks request travels through. List them explicitly:
  # the best entry depends on where this service runs, which the catalog cannot
  # know. Two or three in different regions gives failover and better routing;
  # the pool measures real latency per exit country and learns which entry to
  # prefer.
  slots:
    - jp-tyo-wg-001
    - nl-ams-wg-001
    - us-lax-wg-001
  # If slots is empty, pick this many automatically, spread across regions.
  auto: 2

catalog:
  # Directory of .conf files (written by "global-egress import") or a provider
  # .zip. The files contain a private key, so keep the directory at mode 0700.
  path: /var/lib/global-egress/wireguard

listen:
  # Bind to the internal address clients reach the service on. Never expose
  # these ports to the internet.
  socks5: 10.0.0.70:1080
  http: 10.0.0.70:3128
  control: 10.0.0.70:8080

access:
  # Only these CIDRs may use the proxy and the control API.
  allowed_clients:
    - 10.0.0.0/24
  # Optional shared password for proxy clients. The username always carries the
  # selection policy (cc=, sess=, uniq=, ...), never an identity.
  password: ""
  # password_file: /etc/global-egress/proxy-password
  # Reject proxy clients that present no credentials at all.
  require_auth: false
  # Optional bearer token for the control API.
  control_token: ""
  # control_token_file: /etc/global-egress/control-token

pool:
  # Cap on simultaneously open tunnels. Each open tunnel costs memory and one
  # UDP socket, so raise this only after measuring on the target host.
  max_active: 25
  # Bring this many tunnels up at startup so the first requests are fast.
  preopen: 3
  # Default lifetime of a sticky session (sess=...).
  session_ttl: 10m
  # How long a unique-IP batch (uniq=...) remembers the IPs it used.
  batch_ttl: 15m
  # Default cooldown applied when a client reports a block.
  cooldown: 15m
  # Close tunnels that have served nothing for this long.
  idle_timeout: 10m
  # Bound on bringing one tunnel up, including the WireGuard handshake.
  handshake_timeout: 12s
  # How many slots one request tries before giving up.
  dial_attempts: 3
  # Base backoff for a slot that failed; doubles per consecutive failure.
  failure_backoff: 30s
  # Rate budget for *opening* tunnels. Providers restrict how quickly one device
  # key may associate with new relays; exceeding that looks like key sharing and
  # can get the key blocked for hours. Requests served from already-open tunnels
  # are unaffected. 0 disables the limit.
  new_tunnels_per_window: 120
  new_tunnel_window: 10m
  # Bound on connecting to the destination through a tunnel.
  dial_timeout: 30s
  # Close relayed connections after this much inactivity.
  relay_idle_timeout: 5m
  # Endpoint used to learn a slot's public IP. Set to "" to disable IP
  # measurement, which also disables unique-IP batches.
  ip_check_url: https://am.i.mullvad.net/ip
  ip_check_timeout: 15s
  # How long a measured IP is trusted before it is re-checked.
  ip_refresh_interval: 6h
  # Simultaneous IP measurements. This hits a third-party service; keep it low.
  ip_check_concurrency: 4

destinations:
  # Omit to use the built-in denylist (RFC1918, loopback, link-local, CGNAT,
  # multicast, ...). Set to an empty list to disable filtering entirely.
  # denied_cidrs:
  #   - 10.0.0.0/8
  # Optional destination port allowlist. Empty means all ports.
  allowed_ports: []

# Where the measured public-IP inventory is persisted.
state_dir: /var/lib/global-egress

log:
  level: info
  format: text
