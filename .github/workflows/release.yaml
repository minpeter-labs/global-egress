# Tegami on main (version PR / tag + GitHub Release notes), then side artifacts.
#
#   .tegami/*.md → Version Packages PR → merge → vX.Y.Z tag + Release
#                                         ↓
#                    binaries + SHA256SUMS uploaded to that Release
#                    multi-arch image pushed to ghcr.io/<owner>/<repo>
#
# workflow_dispatch pushes an "edge" image only (no version / no Release).

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Version Packages PR, or on merge of that PR: git tag + GitHub Release body.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # go plugin may run `go mod tidy` while applying a version draft.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci

      - name: Version & release
        run: node scripts/tegami.mts ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Go root module tags are vX.Y.Z (not name@version).
      - name: Detect released tag
        id: tag
        run: |
          tag="$(git tag --points-at HEAD 'v*' | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Released: $tag"
          else
            echo "No release tag on HEAD; skipping binary and image jobs."
          fi

  # Static binaries for bare-metal / LXC installs. Attached to the Release tegami made.
  binaries:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # CGO off so the binary runs on musl (Alpine) guests.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="global-egress-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X main.version=${TAG} -s -w" \
            -o "dist/${name}" ./cmd/global-egress
          (cd dist && sha256sum "${name}" > "${name}.sha256")

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG}" dist/* --clobber

  # Combined checksum file once every matrix binary is on the Release.
  checksums:
    needs: [release, binaries]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # Download only the binary digests we just uploaded.
          for pair in linux-amd64 linux-arm64 darwin-arm64; do
            gh release download "${TAG}" \
              --pattern "global-egress-${pair}.sha256" \
              --dir dist
          done
          (cd dist && cat *.sha256 | sort > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release upload "${TAG}" dist/SHA256SUMS --clobber

  # Multi-arch image; version tags only when tegami just cut a release.
  image:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: version labels
        id: ver
        run: |
          # TAG is vX.Y.Z from the Go plugin.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual smoke: multi-arch "edge" image, no GitHub Release.
  edge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
          build-args: |
            VERSION=edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
