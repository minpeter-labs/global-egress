name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: formatting (gofumpt + goimports)
        run: make fmtcheck

      - name: vet
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: test
        run: go test ./...

      - name: test with race detector
        run: go test -race ./...

      - name: build
        run: go build ./...
